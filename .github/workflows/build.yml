name: Build Turnip 26.0.3 for Winlator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu ninja-build pkg-config meson

      - name: Setup arm64 cross-deps
        run: |
          sudo rm -f /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          printf 'deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse\ndeb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse\ndeb [arch=amd64] http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble main restricted universe multiverse\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-updates main restricted universe multiverse\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports noble-security main restricted universe multiverse\n' | sudo tee /etc/apt/sources.list
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y libdrm-dev:arm64 libx11-dev:arm64 libxext-dev:arm64 libxfixes-dev:arm64 libxcb-glx0-dev:arm64 libxcb-dri2-0-dev:arm64 libxcb-dri3-dev:arm64 libxcb-present-dev:arm64 libxcb-sync-dev:arm64 libxshmfence-dev:arm64 libxrandr-dev:arm64

      - name: Download and extract Mesa 26.0.3
        run: |
          wget -q https://archive.mesa3d.org/mesa-26.0.3.tar.xz
          tar -xf mesa-26.0.3.tar.xz

      - name: Create cross file
        run: |
          cat > cross_aarch64.txt << 'EOF'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'
          [built-in options]
          pkg_config_path = '/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig'
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Configure Mesa
        continue-on-error: true
        run: |
          cd mesa-26.0.3
          meson build --cross-file=../cross_aarch64.txt -Dstrip=true -Dgbm=disabled -Dopengl=false -Dllvm=disabled -Dshared-llvm=disabled -Dplatforms=x11 -Dgallium-drivers= -Dxmlconfig=disabled -Dvulkan-drivers=freedreno -Dmicrosoft-clc=disabled -Dlibunwind=disabled -Dvalgrind=disabled -Dfreedreno-kmds=kgsl,msm -Dprefix=/usr -Dlibdir=lib/aarch64-linux-gnu -Dbuildtype=release 2>&1 | tee ../configure.log

      - name: Build
        run: |
          cd mesa-26.0.3
          ninja -C build -j2

      - name: Package
        id: package
        continue-on-error: true
        run: |
          mkdir -p pkg/usr/lib/aarch64-linux-gnu pkg/usr/share/vulkan/icd.d

          {
            echo "=== build/src/freedreno/vulkan contents ==="
            ls -la mesa-26.0.3/build/src/freedreno/vulkan/ 2>&1
            echo ""
            echo "=== All .so in build ==="
            find mesa-26.0.3/build -name "*.so*" 2>&1
            echo ""
            echo "=== build.ninja exists? ==="
            ls -la mesa-26.0.3/build/build.ninja 2>&1
          } > debug-package.txt 2>&1

          DRIVER=$(find mesa-26.0.3/build -name "libvulkan_freedreno.so" 2>/dev/null | head -1)
          echo "DRIVER=$DRIVER" >> debug-package.txt

          if [ -z "$DRIVER" ]; then
            echo "exit_code=1" >> $GITHUB_OUTPUT
            exit 0
          fi

          cp -L "$DRIVER" pkg/usr/lib/aarch64-linux-gnu/libvulkan_freedreno.so 2>/dev/null || cp "$DRIVER" pkg/usr/lib/aarch64-linux-gnu/libvulkan_freedreno.so
          ls -la pkg/usr/lib/aarch64-linux-gnu/ >> debug-package.txt 2>&1
          file pkg/usr/lib/aarch64-linux-gnu/libvulkan_freedreno.so >> debug-package.txt 2>&1

          cat > pkg/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json << 'JSON'
          {
              "ICD": {
                  "api_version": "1.1.246",
                  "library_path": "/usr/lib/aarch64-linux-gnu/libvulkan_freedreno.so"
              },
              "file_format_version": "1.0.0"
          }
          JSON

          cd pkg && tar --zstd -cf ../turnip-26.0.3.tzst . && cd ..
          ls -la turnip-26.0.3.tzst >> debug-package.txt 2>&1
          tar -tvf turnip-26.0.3.tzst >> debug-package.txt 2>&1
          echo "exit_code=0" >> $GITHUB_OUTPUT

      - name: Commit debug if package failed
        if: steps.package.outputs.exit_code != '0'
        run: |
          cat debug-package.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f debug-package.txt
          git commit -m "Add package debug info" || true
          git push || true

      - name: Fail if package failed
        if: steps.package.outputs.exit_code != '0'
        run: exit 1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-26.0.3
          path: turnip-26.0.3.tzst

      - name: Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v26.0.3
          name: Turnip 26.0.3
          files: turnip-26.0.3.tzst

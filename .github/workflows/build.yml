name: Build Turnip 26.0.3 for Winlator

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            ninja-build pkg-config python3-pip xz-utils
          sudo pip3 install meson --break-system-packages

      - name: Add arm64 architecture and install cross-deps
        run: |
          # Temporarily move third-party repos that don't support arm64
          sudo mkdir -p /tmp/apt-sources-backup
          sudo mv /etc/apt/sources.list.d/* /tmp/apt-sources-backup/ 2>/dev/null || true
          # Also ensure sources.list only has official Ubuntu repos
          echo "deb http://archive.ubuntu.com/ubuntu noble main restricted universe multiverse" | sudo tee /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu noble-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb http://archive.ubuntu.com/ubuntu noble-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list

          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y libdrm-dev:arm64

          # Restore third-party repos
          sudo mv /tmp/apt-sources-backup/* /etc/apt/sources.list.d/ 2>/dev/null || true

          # Verify
          echo "=== libdrm arm64 files ==="
          dpkg -L libdrm-dev:arm64 | head -20
          ls -la /usr/lib/aarch64-linux-gnu/pkgconfig/libdrm*.pc 2>/dev/null

      - name: Download Mesa 26.0.3
        run: |
          wget -q https://archive.mesa3d.org/mesa-26.0.3.tar.xz
          tar -xf mesa-26.0.3.tar.xz

      - name: Create meson cross file
        run: |
          cat > cross_aarch64.txt << 'CROSS_EOF'
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'

          [built-in options]
          pkg_config_path = '/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig'

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          CROSS_EOF

      - name: Configure Mesa
        run: |
          cd mesa-26.0.3
          meson build --cross-file=../cross_aarch64.txt \
            -Dstrip=true \
            -Dcpp_rtti=false \
            -Dgbm=disabled \
            -Dopengl=false \
            -Dllvm=disabled \
            -Dshared-llvm=disabled \
            -Dplatforms=x11 \
            -Dgallium-drivers= \
            -Dxmlconfig=disabled \
            -Dvulkan-drivers=freedreno \
            -Dmicrosoft-clc=disabled \
            -Dlibunwind=disabled \
            -Dvalgrind=disabled \
            -Dfreedreno-kmds=kgsl,msm \
            -Dprefix=/usr \
            -Dlibdir=lib/aarch64-linux-gnu \
            -Dbuildtype=release

      - name: Build
        run: |
          cd mesa-26.0.3
          ninja -C build -j$(nproc)

      - name: Locate build outputs
        run: |
          echo "=== libvulkan_freedreno.so ==="
          find mesa-26.0.3/build -name "libvulkan_freedreno.so" -type f
          echo "=== ICD json files ==="
          find mesa-26.0.3/build -name "*freedreno*icd*.json" -o -name "*freedreno*vulkan*.json"
          echo "=== all json in vulkan dirs ==="
          find mesa-26.0.3/build -path "*vulkan*" -name "*.json"

      - name: Package artifacts
        run: |
          mkdir -p pkg/usr/lib/aarch64-linux-gnu
          mkdir -p pkg/usr/share/vulkan/icd.d
          find mesa-26.0.3/build -name "libvulkan_freedreno.so" -type f -exec cp {} pkg/usr/lib/aarch64-linux-gnu/ \;
          cat > pkg/usr/share/vulkan/icd.d/freedreno_icd.aarch64.json << 'JSON_EOF'
          {
              "ICD": {
                  "api_version": "1.1.246",
                  "library_path": "/usr/lib/aarch64-linux-gnu/libvulkan_freedreno.so"
              },
              "file_format_version": "1.0.0"
          }
          JSON_EOF
          echo "=== Package contents ==="
          find pkg -type f -exec ls -la {} \;
          cd pkg
          tar --zstd -cf ../turnip-26.0.3.tzst .
          cd ..
          ls -la turnip-26.0.3.tzst
          echo "=== Archive contents ==="
          tar -tf turnip-26.0.3.tzst

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-26.0.3
          path: turnip-26.0.3.tzst

      - name: Create Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v26.0.3" turnip-26.0.3.tzst \
            --title "Turnip 26.0.3 for Winlator" \
            --notes "Automated cross-compiled build of Mesa Turnip 26.0.3 for aarch64-linux-gnu (Winlator)"
